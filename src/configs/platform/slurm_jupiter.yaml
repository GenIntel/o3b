link: local
#link: juwels_booster # cannot start from 
use_slurm: True
slurm_type: juwels # tf, juwels

shared_home_with_local: True
restart_upon_fail: True
ws_name: od3d # /work/dlclarge1/sommerl-od3d
pull_od3d: True
pull_od3d_submodules: True
install_od3d: False
juwels_project: hai_1244

path_od3d: /p/project1/${.juwels_project}/sommer7/od3d
#path_od3d: /work/dlclarge1/sommerl-od3d/common3d
path_datasets_raw: /p/project1/${.juwels_project}/sommer7/datasets
path_datasets_preprocess: /p/project1/${.juwels_project}/sommer7/datasets #for student: create your own directory in dlclarge
path_exps: /p/project1/${.juwels_project}/sommer7/exps
#path_cuda: /work/dlclarge1/sommerl-od3d/cudas/cuda-11.7 # should be cuda-11.7
#path_cuda: /usr/local/cuda-11.7 # cannot use shared file cuda for pytorch3d
path_cuda: /p/software/default/stages/2025/software/CUDA/12
#path_cuda: /p/software/default/stages/2026/software/CUDA/13
path_home: /p/project1/${.juwels_project}/sommer7

partition:  booster 
username: sommer7 # hai_1176 ${.juwels_project}
account: ${.juwels_project}
requeue: False

node_count: 1
gpu_count_per_node: 4
cpu_count_per_gpu: 12 # should be 24 but somehow they cap it with billing at 12 (48 for 4 gpus)
ram_per_cpu: "10gb" # should be 5gb
walltime: "24:00:00" #  "24:00:00"
renderer: pytorch3d

mp_start_method: "fork" # "fork" "spawn" "forkserver"
mp_sharing_strategy: "file_system" # "file_descriptor" "file_system"
# file_descriptor is default but doesnt work on slurm tf
nofile_limit: "hard" # `ulimit -n` for the job, see slurm.yaml


