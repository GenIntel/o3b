# SETUP JUELICH

# 1) SETUP SSH
# there are several hosts on juelich, to create an ssh key:

# 1.1 create ssh key:
# ssh-keygen -t ed25519 -a 100 -f ~/.ssh/id_ed25519_jupiter
# 1.2 copy public key: 
# cat ~/.ssh/id_ed25519_jupiter.pub
# 1.3 find online what is my ip addr (copy ip addr) 
# 1.4 insert online: from="<ip-addr>,<ip-addr-mask>" <ssh-public-key>
# from="132.230.0.0/16" ssh-ed25519 AAAAC3N...
# 1.5 adapt ssh config
# nano ~/.ssh/config
# Host juwels
#     User sommer7
#     HostName juwels-booster.fz-juelich.de
#     ServerAliveInterval 60
#     IdentityFile ~/.ssh/id_ed25519_juwels
# Host jupiter
#     User sommer7
#     HostName login.jupiter.fz-juelich.de
#     ServerAliveInterval 60
#     IdentityFile ~/.ssh/id_ed25519_jupiter





