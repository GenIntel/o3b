defaults:
  - default
  - _self_
  - optional override custom@: jupiter_custom

# JUPITER (JSC Jülich) — NVIDIA Grace-Hopper, **aarch64**.
#
#   o3b platform setup -p slurm_jupiter
#
# How this differs from the LMB cluster (slurm.yaml), and why each key is set:
#
#  * arch      — Grace CPUs are arm64, not x86_64. Every wheel must be an
#                aarch64 build; CUDA's per-target tree is targets/sbsa-linux/
#                rather than targets/x86_64-linux/ (handled automatically in
#                setup_slurm.sh / the job preamble via `uname -m`).
#  * account   — JSC rejects any job without a budget account.
#  * walltime  — hard cap of 12:00:00 on the booster partition.
#  * node      — whole nodes are allocated and charged; --mem is rejected, so
#                exclusive_nodes disables it. 4 GPUs and 288 cores per node
#                (4 Grace modules x 72, one thread per core — not SMT).
#  * nccl_env   — deliberately absent. This file extends `default`, NOT `slurm`,
#                so it inherits none of slurm.yaml's NCCL settings, and it must
#                stay that way: both of them are workarounds for LMB hardware
#                defects that do not exist here (see the block at the bottom).
#  * proxy     — JSC routes to the internet directly. Empty on purpose: the
#                tfproxy inherited from slurm.yaml would break every request.
#  * modules   — no usable system python / git / CUDA; all come from Lmod.
#  * conda     — the Anaconda *defaults* channel is blocked here for licensing
#                reasons, so `conda create python=…` cannot resolve. Use a venv
#                on top of the Lmod Python instead of the conda layout the LMB
#                platform uses.
#
# SETUP SSH (one-off)
#   ssh-keygen -t ed25519 -a 100 -f ~/.ssh/id_ed25519_jupiter
#   cat ~/.ssh/id_ed25519_jupiter.pub
#   upload via JuDoor with a from= clause, e.g.
#     from="132.230.0.0/16" ssh-ed25519 AAAAC3N...
#   ~/.ssh/config:
#     Host jupiter
#         User sommer7
#         HostName login.jupiter.fz-juelich.de
#         ServerAliveInterval 60
#         IdentityFile ~/.ssh/id_ed25519_jupiter
#         ControlMaster auto
#         ControlPath ~/.ssh/cm-%r@%h:%p
#         ControlPersist 8h
#
# JUPITER additionally requires a TOTP second factor on every connection, which
# the non-interactive ssh/scp calls `o3b platform setup` makes cannot answer.
# The ~/.ssh/config entry above therefore sets ControlMaster/ControlPath/
# ControlPersist: authenticate once per session with
#     ssh jupiter          # enter the 6-digit token, then exit
# and every later connection reuses that master socket silently. Check or drop
# the socket with `ssh -O check jupiter` / `ssh -O exit jupiter`.

ssh: jupiter
username: sommer7
account: scale3dcompnet
project: scale3dcompnet

# Login and compute nodes do NOT mount the same tree. Login sees the old JUST5
# projects under /p (hai_1244 lives there); compute nodes have no /p at all and
# instead mount the new filesystem under /e, where only scale3dcompnet exists.
# /e is visible from both, so every path below must be an /e path -- a /p path
# would work interactively and then fail inside every job.
#   NOTE: the datasets under /p/project1/hai_1244/sommer7 are therefore NOT
#   reachable from compute nodes and have to be copied to /e before use.

# JSC compute and login nodes reach the internet directly — must stay empty to
# override the tfproxy that slurm.yaml sets for LMB.
http_proxy: ""

# Lmod modules, loaded (in order) before anything else by both setup_slurm.sh
# and the compute-node preamble.
modules:
  - Stages/2025
  - GCC
  - CUDA/12
  - Python
  - git

path_ws: /e/project1/${.project}/sommer7
path_home: /e/project1/${.project}/sommer7
path_datasets_raw: /e/project1/${.project}/sommer7/datasets
path_datasets_preprocess: /e/project1/${.project}/sommer7/datasets
path_datasets_sshfs: ${.path_datasets_raw}
path_exps: /e/project1/${.project}/sommer7/exps
# Stage 2025: nvcc 12.6 and Python 3.12.3. Stage 2026 is the current default but
# ships CUDA 13 / Python 3.13, which torch 2.6 has no wheels for.
path_cuda: /e/software/default/stages/2025/software/CUDA/12

# scratch is the I/O-heavy tier (auto-purged after 90 days), which is what the
# HF Arrow build cache wants; the finished shards land in path_datasets_preprocess.
# Exported as HF_HOME, so the hub download cache lands here too rather than in
# the home quota — see the note in slurm.yaml. Purging costs nothing here: the
# compute nodes have no route to the internet, so hub/ only ever holds what a
# login-node download put there.
path_hf_home: /e/scratch/${.project}/sommer7/hf

# venv, not conda — see the note on the blocked defaults channel above.
use_conda: False

# aarch64 CUDA wheels: torch publishes sbsa builds under the cu126 index.
# cuda_version drives the wheel index (cu126) and the venv name; it must be set
# explicitly because JSC's install is .../CUDA/12 (the dir name loses the minor).
cuda_version: "12.6"
python_version: "3.12"
torch_version: "2.6.0"

# GH200 is compute capability 9.0. This must be set explicitly: left unset, torch
# auto-detects from the visible cards and dies on this hardware, because
# torch.cuda.get_arch_list() reports sm_90a and torch 2.6's _get_cuda_arch_flags
# does int(arch.split('_')[1]) -> int('90a') -> ValueError. It also makes the
# built extensions independent of which GPU the login node happens to expose.
torch_cuda_arch_list: "9.0"

# Compute nodes have no route to the internet (verified: curl to github fails
# with "Couldn't connect to server"), so a batch-job setup could never clone or
# pip-install. The login nodes do have connectivity and share the Grace-Hopper
# arch, so CUDA extensions built there are correct for the compute nodes.
setup_on_login: True

branch: main
# True, and read only by `o3b platform setup`, which runs on the login node
# where the network works. The compute-node job preamble skips fetching
# automatically because setup_on_login is set -- it has no route to github, and
# a fetch there fails the job with "Failed to connect to github.com port 443".
# So: re-run `o3b platform setup -p slurm_jupiter*` to pick up new commits.
pull: True
pull_submodules: True

setup: False
restart_upon_fail: False   # JSC accounting charges a requeued job again

deps:
  #- diff3f
  #- morpheus
  #- genpose2

partition: booster
node_count: 1
gpu_count_per_node: 4
# 288 physical cores / 4 GPUs.  A booster node is 4 Grace modules of 72 cores
# each (lscpu: Core(s) per socket 72, Socket(s) 4, 1 thread per core) = 288, not
# the 72 an earlier version of this comment assumed.  Since JSC allocates and
# charges whole nodes, the bill is the same either way — asking for less only
# shrinks the affinity mask:
#   --cpus-per-task 72   ->  affinity 0-71,  AllocTRES billing=288,cpu=288
#   --cpus-per-task 288  ->  affinity 0-287, AllocTRES billing=288,cpu=288
# Do not drop the key to "inherit the node": with no --cpus-per-task at all srun
# pins the task to a single CPU (verified — affinity list "0").
cpu_count_per_gpu: 72
ram_per_cpu: "6gb"          # advisory only: whole nodes (480gb) are allocated
exclusive_nodes: True       # JSC rejects --mem
walltime: "12:00:00"        # hard cap on booster

renderer: pytorch3d

# Compute nodes cannot reach the wandb servers, and there is no API key here
# (LMB authenticates via ~/.netrc). Offline mode needs neither: runs are written
# to a local wandb/ directory and uploaded afterwards from a login node, which
# does have connectivity:
#     o3b bench wbsync -p slurm_jupiter -n     # list what is pending
#     o3b bench wbsync -p slurm_jupiter        # upload it
# That needs credentials the login node does not have by default -- either run
# `wandb login` there once, or set credentials.wandb.api_key in
# credentials/custom/*.yaml (shipped to the cluster by `o3b platform setup`).
wandb_mode: "offline"

# torch.hub downloads on first use, which a compute node cannot do -- the method
# then fails to build and the run silently falls back to GT/oracle. So the cache
# lives on shared storage (not $HOME: that is capped at ~19 GiB here) and
# `o3b platform setup` pre-populates it on the login node.
# Listed as "<owner>/<repo>:<model>". All four DINOv2 sizes are warmed because
# ablations under ablation/morpheus/backbone/ swap between them (~6 GB total).
path_torch_home: /e/project1/${.project}/sommer7/torch_home
warm_torch_hub:
  - facebookresearch/dinov2:dinov2_vits14
  - facebookresearch/dinov2:dinov2_vitb14
  - facebookresearch/dinov2:dinov2_vitl14
  - facebookresearch/dinov2:dinov2_vitg14

mp_start_method: "fork"      # "fork" "spawn" "forkserver"
mp_sharing_strategy: "file_system"
nofile_limit: "hard"         # `ulimit -n` for the job, see slurm.yaml

# NCCL — nothing set on purpose; NCCL's own defaults are already right here.
#
# Do NOT copy slurm.yaml's nccl_env over. Both of its entries are workarounds
# for LMB hardware and would be cargo-culted here:
#
#   NCCL_SHM_DISABLE=1  works around a broken /dev/shm NCCL segment on specific
#                       dlc2gpu nodes. No such defect on the booster.
#   NCCL_P2P_LEVEL=SYS  is needed because the L40S pairs are `NODE` in
#                       nvidia-smi topo -m (PCIe host bridge), which NCCL's
#                       default P2P level will not cross. The GH200s here are
#                       NVLink/NVSwitch and NCCL selects P2P unaided.
#
# Measured on jpbo-016-30, 4x GH200, all-reduce of 1.13 GiB (ViT-L/14 fp32
# gradients) with this empty nccl_env:
#
#   P2P/CUMEM   5.6 ms   216 GB/s algbw   324 GB/s busbw
#
# versus 519.6 ms / 3.51 GB/s for the same collective on slurm_lmbl40 as it was
# configured before NCCL_P2P_LEVEL was added — a 93x gap. Single node only.
#
# NOT MEASURED: multi-node. The booster has four IB rails per node
# (NCCL reports "Using [0]mlx5_0:1/IB [1]mlx5_1:1/IB [2]mlx5_2:1/IB
# [3]mlx5_3:1/IB [RO]; OOB ib0"), and a single-node probe never exercises them
# because the collective stays on NVLink. If node_count > 1 scales poorly,
# inter-node NCCL tuning (rail/HCA selection, CollNet/SHARP) is the place to
# look — but measure before setting anything.
