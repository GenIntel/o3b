defaults:
  - default
  - _self_
  - optional override custom@: jupiter_custom

# JUPITER (JSC Jülich) — NVIDIA Grace-Hopper, **aarch64**.
#
#   o3b platform setup -p slurm_jupiter
#
# How this differs from the LMB cluster (slurm.yaml), and why each key is set:
#
#  * arch      — Grace CPUs are arm64, not x86_64. Every wheel must be an
#                aarch64 build; CUDA's per-target tree is targets/sbsa-linux/
#                rather than targets/x86_64-linux/ (handled automatically in
#                setup_slurm.sh / the job preamble via `uname -m`).
#  * account   — JSC rejects any job without a budget account.
#  * walltime  — hard cap of 12:00:00 on the booster partition.
#  * node      — whole nodes are allocated and charged; --mem is rejected, so
#                exclusive_nodes disables it. 4 GPUs and 288 SMT cores per node.
#  * proxy     — JSC routes to the internet directly. Empty on purpose: the
#                tfproxy inherited from slurm.yaml would break every request.
#  * modules   — no usable system python / git / CUDA; all come from Lmod.
#  * conda     — the Anaconda *defaults* channel is blocked here for licensing
#                reasons, so `conda create python=…` cannot resolve. Use a venv
#                on top of the Lmod Python instead of the conda layout the LMB
#                platform uses.
#
# SETUP SSH (one-off)
#   ssh-keygen -t ed25519 -a 100 -f ~/.ssh/id_ed25519_jupiter
#   cat ~/.ssh/id_ed25519_jupiter.pub
#   upload via JuDoor with a from= clause, e.g.
#     from="132.230.0.0/16" ssh-ed25519 AAAAC3N...
#   ~/.ssh/config:
#     Host jupiter
#         User sommer7
#         HostName login.jupiter.fz-juelich.de
#         ServerAliveInterval 60
#         IdentityFile ~/.ssh/id_ed25519_jupiter
#         ControlMaster auto
#         ControlPath ~/.ssh/cm-%r@%h:%p
#         ControlPersist 8h
#
# JUPITER additionally requires a TOTP second factor on every connection, which
# the non-interactive ssh/scp calls `o3b platform setup` makes cannot answer.
# The ~/.ssh/config entry above therefore sets ControlMaster/ControlPath/
# ControlPersist: authenticate once per session with
#     ssh jupiter          # enter the 6-digit token, then exit
# and every later connection reuses that master socket silently. Check or drop
# the socket with `ssh -O check jupiter` / `ssh -O exit jupiter`.

ssh: jupiter
username: sommer7
account: scale3dcompnet
project: scale3dcompnet

# Login and compute nodes do NOT mount the same tree. Login sees the old JUST5
# projects under /p (hai_1244 lives there); compute nodes have no /p at all and
# instead mount the new filesystem under /e, where only scale3dcompnet exists.
# /e is visible from both, so every path below must be an /e path -- a /p path
# would work interactively and then fail inside every job.
#   NOTE: the datasets under /p/project1/hai_1244/sommer7 are therefore NOT
#   reachable from compute nodes and have to be copied to /e before use.

# JSC compute and login nodes reach the internet directly — must stay empty to
# override the tfproxy that slurm.yaml sets for LMB.
http_proxy: ""

# Lmod modules, loaded (in order) before anything else by both setup_slurm.sh
# and the compute-node preamble.
modules:
  - Stages/2025
  - GCC
  - CUDA/12
  - Python
  - git

path_ws: /e/project1/${.project}/sommer7
path_home: /e/project1/${.project}/sommer7
path_datasets_raw: /e/project1/${.project}/sommer7/datasets
path_datasets_preprocess: /e/project1/${.project}/sommer7/datasets
path_exps: /e/project1/${.project}/sommer7/exps
# Stage 2025: nvcc 12.6 and Python 3.12.3. Stage 2026 is the current default but
# ships CUDA 13 / Python 3.13, which torch 2.6 has no wheels for.
path_cuda: /e/software/default/stages/2025/software/CUDA/12

# scratch is the I/O-heavy tier (auto-purged after 90 days), which is what the
# HF Arrow build cache wants; the finished shards land in path_datasets_preprocess.
path_hf_datasets_cache: /e/scratch/${.project}/sommer7/hf_datasets

# venv, not conda — see the note on the blocked defaults channel above.
use_conda: False

# aarch64 CUDA wheels: torch publishes sbsa builds under the cu126 index.
# cuda_version drives the wheel index (cu126) and the venv name; it must be set
# explicitly because JSC's install is .../CUDA/12 (the dir name loses the minor).
cuda_version: "12.6"
python_version: "3.12"
torch_version: "2.6.0"

# Compute nodes have no route to the internet (verified: curl to github fails
# with "Couldn't connect to server"), so a batch-job setup could never clone or
# pip-install. The login nodes do have connectivity and share the Grace-Hopper
# arch, so CUDA extensions built there are correct for the compute nodes.
setup_on_login: True

branch: main
pull: True
pull_submodules: True
skip_submodules:
  - third_party/od3d

setup: False
restart_upon_fail: False   # JSC accounting charges a requeued job again

deps:
  #- diff3f
  #- morpheus
  #- genpose2

partition: booster
node_count: 1
gpu_count_per_node: 4
cpu_count_per_gpu: 18       # 72 physical cores / 4 GPUs
ram_per_cpu: "6gb"          # advisory only: whole nodes (480gb) are allocated
exclusive_nodes: True       # JSC rejects --mem
walltime: "12:00:00"        # hard cap on booster

renderer: pytorch3d

mp_start_method: "fork"      # "fork" "spawn" "forkserver"
mp_sharing_strategy: "file_system"
nofile_limit: "hard"         # `ulimit -n` for the job, see slurm.yaml
