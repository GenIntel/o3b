defaults:
  - _self_
  - optional custom@: default_custom

github:
  token: 

kaggle:
  username: "..."
  key: "..."

# Only needed on platforms that run wandb_mode: offline and so upload later with
# `o3b bench wbsync`. Left at the "..." placeholder, wbsync exports nothing and
# falls back to whatever `wandb login` wrote to the remote ~/.netrc.
wandb:
  api_key: "..."

opendatalab:
  username: "..."
  password: "..."

weights:
  "dinov3_vits16": "..."
  "dinov3_vits16plus": "..."
  "dinov3_vitb16": "..."
  "dinov3_vitl16": "..."