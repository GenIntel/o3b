defaults:
  - slurm_lmbl40
  - _self_

# slurm_lmbl40 plus the affnet dependency group: AffordanceNet's AffordanceVLM-7B
# (transformers 4.31, its own env <repo>_py310_cu124_torch26_affnet) as the H12
# baseline on HANDAL handle segmentation.
#
#   o3b platform setup -p slurm_lmbl40_affnet
#   o3b platform run -p slurm_lmbl40_affnet -c "python research/hypotheses/h12-handal-affordance/quantitative/run_affordancevlm_handal.py ..."
deps:
  - affnet

# off the training partition, whose per-account GPU cap the training runs fill
partition: alldlc2_gpu-l40s
