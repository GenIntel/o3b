defaults:
  - _self_
  - credentials@credentials: default
  - optional custom@: default_custom

ssh: False

path_datasets_raw: /data/lmbraid19/sommerl/datasets # sshfs maythux@192.168.xx.xx:/home/maythuxServ/Mounted ~/remoteDir
path_datasets_preprocess: /data/lmbraid19/sommerl/datasets # for student: /misc/student/srinivap/datasets_preprocess

path_ws: /data/lmbraid19/sommerl/workspace
path_exps: ${.path_ws}/exps
path_models: ${.path_ws}/models
path_cuda: /usr/local/cuda-12.4
python_version: "3.10"
torch_version: "2.6.0"

# install into a conda env instead of a venv. The CUDA toolchain then comes from
# the env (conda -c nvidia cuda-toolkit=${cuda_version}) rather than path_cuda,
# and the env lives at ${path_conda}/envs/<repo>_py310_cu124_torch26[_deps].
# Requires a miniconda install at path_conda.
use_conda: False
path_conda: ${.path_ws}/miniconda3
cuda_version: "12.4"   # conda cuda-toolkit version (use_conda only)

# optional dependency groups installed by `o3b platform setup` (each adds a
# suffix to the venv name). available: diff3f, densematcher, genpose2
deps:
  # - diff3f
  # - densematcher
  #- genpose2

url_repo: https://${.credentials.github.token}@github.com/GenIntel/od3d.git

renderer: open3d # pytorch3d

ram_per_cpu: "5gb"
cpu_count_per_gpu: 16
gpu_count_per_node: 1
node_count: 1
walltime: "24:00:00" #  "24:00:00"


