defaults:
  - slurm_lmbl40
  - _self_

# slurm_lmbl40 with all 16 of a GPU's CPUs, for CPU-bound jobs that have to fit
# the partition's 24 h walltime — the Every9D train shard build decodes ~1.77M
# video frames at ~25 items/s on 8 workers (~20 h), so it runs here with 16.
#
#   o3b dataset init -d every9d_v7_train_max5_sharded -p slurm_lmbl40_cpu16 --remote
#
# ram_per_cpu halves so the product stays at the partition's 128 GB per GPU
# (see slurm_lmbl40.yaml).
cpu_count_per_gpu: 16
ram_per_cpu: "8gb"
