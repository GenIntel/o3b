# Sharded variant of hc3d_frame_object_test_real_pair (real / ROPE test data),
# filtered to a single category via ${category}.
#
# Only these categories are annotated in the real (ROPE) data:
#   bread, facial_cream, hair_dryer, handbag, tooth_brush

# 1) index frame object
# o3b dataset index -d hc3d_frame_object_test_real --remote -p slurm_lmbl40

# 2) shard dataset
# o3b dataset init -d hc3d_frame_object_test_real_pair_cat_sharded --remote -p slurm_lmbl40 --override
# o3b dataset init -d hc3d_frame_object_test_real_pair_cat_sharded --override -p slurm_lmbl40 --remote -a "-c bread,-c facial_cream,-c hair_dryer,-c handbag,-c tooth_brush"

# 3) viz
# o3b dataset viz -d hc3d_frame_object_test_real_pair_cat_sharded -p slurm_lmbl40 --remote

# 3b) upload the built shards to the HuggingFace Hub (one folder per category)
# o3b dataset hf-upload -d hc3d_frame_object_test_real_pair_cat_sharded --override -p slurm_lmbl40 --remote -a "-c bread,-c facial_cream,-c hair_dryer,-c handbag,-c tooth_brush"

# 4) copy the built shards to another platform
# o3b dataset sync-shard -d hc3d_frame_object_test_real_pair_cat_sharded -s slurm -t slurm_jupiter -c '*'


defaults:
  - hc3d_frame_object_test_pair_cat_sharded
  # filter_frames: same annotated frame subset as hc3d_frame_object_test_real_pair
  # (rebuild the shards with --override to pick this up in an existing cache)
  - hc3d_frames_test_real
  - _self_

# filter_is_real: null → all data  |  false → synthetic only  |  true → real only
filter_is_real: true

# Same pair sampling as hc3d_frame_object_test_real_pair (this config descends
# from the *synthetic* sharded pair config, so it does not inherit them): every
# whitelisted frame of each instance, with a cap that no longer truncates.
# Note this moves sharded_name from n1000 to n10000, i.e. a new cache directory
# beside the old one rather than an overwrite.
frame_pair_views_per_instance: -1
filter_count_max: 10000

# distinct from the synthetic sharded cache (same fields, different source data)
sharded_name: hc3d_frame_object_test_real_n${filter_count_max}_b${sharded_shard_size}_r${img_size}_m${mesh_type}_c${category}

# own hub repo per category, like the cache itself (inherited from the synthetic
# pair config otherwise, which would mix the two datasets into one repo)
huggingface_name: GenIntel/hc3d_frame_object_test_real_pair_cat_sharded_c${category}
use_huggingface: false
