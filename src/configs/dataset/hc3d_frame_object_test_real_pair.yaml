# Frame-object *pairs* over the real (ROPE) subset of the test split.
#
# Build the frame index first (shared with hc3d_frame_object_test):
#   o3b dataset index -d hc3d_frame_object_test
#
# Browse pairs in viser:
#   o3b dataset viz   -d hc3d_frame_object_test_real_pair
#   o3b dataset viz   -d hc3d_frame_object_test_real_pair --object-centric

defaults:
  - hc3d_frame_object_test_pair
  # filter_frames: same annotated frame subset hc3d_frame_object_test_real uses,
  # so pairs are formed only from those frames
  - hc3d_frames_test_real
  - _self_

# filter_is_real: null → all data  |  false → synthetic only  |  true → real only
filter_is_real: true

# The frame whitelist leaves only 73-108 frames per category (6-40 per
# instance), so sampling 50 views per instance (the synthetic default) would
# duplicate frames and spend the pair budget on repeated combinations.  Taking
# every filtered frame instead makes the pool exactly the real frame
# combinations: 3564 / 6786 / 8262 / 6882 / 5190 pairs for bread / facial_cream
# / hair_dryer / handbag / tooth_brush.
frame_pair_views_per_instance: 50

# filter_count_max still caps that pool at 1000 pairs per category (inherited
# value, kept explicit here): the items are drawn broad-coverage-first, so the
# cut keeps view combinations spread over each instance's frames rather than
# clustered at its start.
filter_count_max: 1000

# Only these categories are annotated in the real (ROPE) data.
categories:
  - bread
  - facial_cream
  - hair_dryer
  - handbag
  - tooth_brush


