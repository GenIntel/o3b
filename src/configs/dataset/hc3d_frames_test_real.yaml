# Frame whitelist for the real (ROPE) test subset of HouseCorr3D.
#
# Shared fragment: list it in the `defaults:` of every config that should be
# restricted to this frame subset (hc3d_frame_object_test_real,
# hc3d_frame_object_test_real_pair, ...). It carries nothing but
# `filter_frames`, so it merges cleanly on top of any of them.
#
# Structure:  filter_frames.<group>.<scene_name> -> [frame_id, ...]
#   <group>      tokens are matched against the row's split / data_type, so
#                "test_real" selects split=test AND data_type=real.
#   <scene_name> ROPE scene directory name.
#   <frame_id>   frame prefix of "<frame_id>_color.png"; frames.db stores
#                frame_id as "<data_type>/<scene_name>/<frame_id>/<object_idx>".
#   A scene mapped to null (no list) keeps all of that scene's frames.
#
# 59 scenes, 565 frames in total (~10 evenly-spaced views per scene).

