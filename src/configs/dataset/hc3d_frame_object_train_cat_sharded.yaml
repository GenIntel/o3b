# Sharded hc3d_frame_object filtered to a single category (toy_boat).
#
# Items are materialised once into
#   <path_preprocess>/sharded/<sharded_name>
# and loaded from there on subsequent runs. The category name is part of the
# sharded_name so per-category shards live side by side.

# 1) fetch
# o3b dataset fetch -d hc3d_frame_object_train_cat_sharded

# 2) index either many cats or single cat: 
# o3b dataset index -d hc3d_frame_object_train -p slurm_lmbl40 --remote
# o3b dataset index -d hc3d_frame_object_train_cat_sharded -p slurm_lmbl40 --remote

# 3) init
# o3b dataset init -d hc3d_frame_object_train_cat_sharded -p slurm_lmbl40 --remote
#
# 3b) init all 50 categories — -a starts one run per comma-separated ablation
#     (each ablation is a fragment of extra `o3b dataset init` args, here `-c <category>`);
#     with --remote every category is submitted as its own sbatch job.
# o3b dataset init -d hc3d_frame_object_train_cat_sharded -p slurm_lmbl40 --remote -a "-c backpack,-c book,-c bottle,-c box,-c bread,-c coconut,-c conch,-c corn,-c dinosaur,-c dish,-c doll,-c egg,-c eraser,-c facial_cream,-c flower_pot,-c glasses_case,-c hair_dryer,-c hamburger,-c handbag,-c hand_cream,-c knife,-c lemon,-c light,-c lotus_root,-c mango,-c mangosteen,-c medicine_bottle,-c mouse,-c mug,-c orange,-c pillow,-c pomegranate,-c power_strip,-c remote_control,-c sausage,-c shampoo,-c shoe,-c shrimp,-c teapot,-c tooth_brush,-c tooth_paste,-c toy_animals,-c toy_boat,-c toy_bus,-c toy_car,-c toy_motorcycle,-c toy_plane,-c toy_train,-c toy_truck,-c wallet"

# 4) viz
# o3b dataset viz -d hc3d_frame_object_train_cat_sharded -p slurm_lmbl40 --remote

# 4b) upload the built shards to the HuggingFace Hub — one repo per category,
#     ${huggingface_name}, converted to Parquet (one config per sharded_name) so
#     the repo gets a dataset viewer + Croissant; --override replaces it
# o3b dataset hf-upload -d hc3d_frame_object_train_cat_sharded --override -p slurm_lmbl40 --remote -a "-c backpack"
#     …and, on the consuming machine, set use_huggingface: true to pull them
#     into <path_preprocess>/sharded/ instead of building them from raw data

# 5) copy the built shards to another platform (runs on this machine, which is the
#    only host that can reach both clusters; -c '*' takes every category at once,
#    -n previews). Re-runs resume; an existing identical target is skipped.
# o3b dataset sync-shard -d hc3d_frame_object_train_cat_sharded -s slurm -t slurm_jupiter -c '*'


# ? is it useful to do preprocessing for the meshes before sharding ?
# o3b dataset preprocess -d hc3d_frame_object_train_cat_sharded --remote -p slurm_lmbl40


defaults:
  - hc3d_frame_object_train
  - _self_

# Single category to filter for; referenced below via ${category} so the
# category name is also reflected in the sharded dataset directory.
category: hair_dryer

mesh_type: "mc16"

categories:
  - ${category}

filter_count_max: 50000 # 50000 # per category if categories is applied

img_size: 512
sharded_shard_size: 100 # cache batch size and final shard size
# note that especially cache batch size heavily affects /dev/shm when using shared memory
# worker processes for the one-off shard build (items are loaded + serialised to
# bytes in the workers, so /dev/shm tensor transport is not involved); 0 = sequential

# actually it seems like /dev/shm is currently not affected probably only when 
#   torch.multiprocessing.set_sharing_strategy("file_system") instead of 
#   torch.multiprocessing.set_sharing_strategy("file_descriptor")  (DEFAULT)

sharded_num_workers: 4
# perhaps this should be ram_in_gb / sharded_worker_gb = 20 / 5 = 4
# sharded_worker_gb: see that each worker usually creates their own dataset copy


sharded_transform:
  class_name: CropCamBBox2D
  H: ${img_size}  # 512 # 256->512 1% improvement for tooth brush
  W: ${img_size}
  # per-side crop margin as a fraction of bbox size (crop spans 1 + 2*bbox_overlap)
  bbox_overlap: 0.15
  crop_type: "crop_large_side" # "crop_large_side" | "crop_small_side" | "crop_resize_ratio"

transform:

sharded_name: hc3d_frame_object_train_n${filter_count_max}_b${sharded_shard_size}_r${img_size}_m${mesh_type}_c${category}
sharded_override: false


# HuggingFace Hub repo holding this category's sharded cache — one repo per
# category (see hf-upload above). The cache is uploaded as Parquet under a config
# named after ${sharded_name}, so caches that differ only in shard parameters
# (n / b / r / mesh_type) live side by side in it, and the repo gets a dataset
# viewer + Croissant file (raw save_to_disk .arrow gets neither).
# use_huggingface: true loads that config from the hub (into the datasets cache)
# instead of building it from the raw data, so no index / SOPE files are
# needed on that machine.
huggingface_name: GenIntel/hc3d_frame_object_train_cat_sharded_c${category}
use_huggingface: false

# overrides the (already-lowered) default from hc3d_frame_object_pair.yaml;
# kept explicit here since this is the config that actually triggers the build
#
 

# sharded_transform is baked into the shards at build time (applied once per
# item in the shard-build workers), so reads from the cache pay no crop cost.
# transform (empty here) would additionally run in __getitem__ on every access.
# NOTE: changing sharded_transform requires a rebuild (sharded_override: true
# or bump sharded_name) — an existing cache dir is loaded as-is.
