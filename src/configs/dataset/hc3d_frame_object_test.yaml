# o3b dataset fetch -d hc3d_frame_object_test
# o3b dataset index -d hc3d_frame_object_test --remove
# o3b dataset index -d hc3d_frame_object_test --remote -p slurm_lmbl40
# (filter_count_max stops indexing after this many filter-matching rows; also limits viz)


# o3b dataset preprocess -d hc3d_frame_object_test --remote -p slurm_lmbl40

# o3b dataset viz   -d hc3d_frame_object_test

defaults:
  - hc3d
  - _self_

class_name: HouseCorr3D

mesh_type: "mc16"

# mesh_type: "mc16_vuni4_r256_fdinov2s"

item_type: frame_object

# split: "train" | "test" | "all"
split: test

# filter_is_real: null → all data  |  false → synthetic only  |  true → real only
filter_is_real: false
filter_has_kpts: true
filter_count_max: 2000 # per category if categories is applied
# by having more than 1000, we ensure that we get 50 views per instance. 

modalities:
  - rgb                    # GenPose2 input
  - depth                  # GenPose2 input
  - depth_mask             # GenPose2 input
  - fo_mask                # GenPose2 input (object instance mask)
  - cam_intr4x4            # crop transform + GenPose2
  - cam_tform4x4_obj       # GT pose
  - cam_tform4x4_obj_ncds  # task: maps obj_kpts3d (NCDS) → camera space
  - cam_bbox2d             # required by the CropCamBBox2D transform
  - cam_bbox3d             # obj-space 3D box side lengths (drawn in qualit)
  - obj_kpts3d
  - obj_kpts3d_mask
  - obj_kpts2d_mask         # occlusion-aware visibility (amodal = annotated but not visible)
  - obj_syms                # per-axis symmetry code (see CamCrsp3DNNTask keypoint symmetry eval)
  - category


# modalities:
#   - rgb
#   - fo_mask
#   #- depth
#   #- depth_mask
#   - cam_intr4x4
#   - cam_tform4x4_obj
#   - cam_bbox2d
#   - cam_bbox3d
#   - obj_kpts3d
#   - obj_bbox3d
#   - obj_kpts3d_mask
#   - obj_kpts2d_mask
#   - obj_syms
#   - category



transform:
  class_name: CropCamBBox2D
  H: 512 #256 # 256
  W: 512 # 256 # 256
  # per-side crop margin as a fraction of bbox size (crop spans 1 + 2*bbox_overlap)
  bbox_overlap: 0.15
  crop_type: "crop_large_side" # "crop_large_side" | "crop_small_side" | "crop_resize_ratio"

categories:
