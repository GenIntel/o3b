# handal_train_aff_inst1_sharded — H12 low data, "10 %": one train instance per category.
#
#   o3b dataset init -d handal_train_aff_inst1_sharded -p slurm_lmbl40 --remote
#
# handal_train_aff_sharded restricted to every sequence of one random object
# instance per category (seed 0, among instances with handle part meshes;
# research/tasks/H12/scripts/pick_low_data.py). HANDAL train has 9 instances per
# category (adjustable wrench 10, claw hammer 16), so one instance is ~11 %:
# 178 of 1,684 sequences. Selected by object id = category/sequence.
# Own sharded_name: shards are read back wholesale, so the full cache would
# ignore the selection.

