# omni6dpose_sope_train — the synthetic (SOPE) train half of Omni6DPose, ALL categories.
#
# 1) re-index (required: the existing frames.db was written by the housecorr3d
#    configs, so it holds only their categories — ROPE 5 of 149, SOPE test 99
#    and train 50 of 153. Indexing filters on cfg.categories and
#    filter_count_max, so those caps are baked into what was written.)
#      o3b dataset index -d omni6dpose_sope_train -p slurm_lmbl40 --remote
#
# 2) shard
#      o3b dataset init -d omni6dpose_sope_train_sharded -p slurm_lmbl40 --remote
#
# Distinct from the hc3d_* configs, which are the 50-category keypoint-annotated
# correspondence subset. This is the whole dataset for the pose benchmark:
#   categories: null        all of them, not the housecorr50 list
#   filter_has_kpts: false  keypoints exist for a minority; requiring them is
#                           what reduced SOPE test to 50 categories
#
# Indexing unfiltered is additive, not destructive: frames is keyed by frame_id
# and the hc3d configs filter on categories and has_kpts at *read* time, so they
# keep seeing exactly what they see now.

defaults:
  - hc3d_frame_object_train
  - _self_

item_type: frame_object
split: train
filter_is_real: false
filter_has_kpts: false
categories:
filter_count_max:

# SOPE is thinned the way od3d thinned it: subset_fraction 0.1, a uniform
# random 10% of the valid rows, and NO per-sequence cap. (ROPE, by contrast, is
# capped at 16 views per object track.) SOPE scenes are short — ~24 frames — so
# the per-track cap barely bites there: it kept 975,771 of SOPE test's 1,023,279
# valid rows, ~175 GB as a shard, against ~102k at 0.1. od3d sampled unseeded;
# subset_seed fixes ours.
extra:
  frames_count_max_per_sequence:
  subset_fraction: 0.1
  subset_seed: 0
  # od3d's category-level orientation: each category's objects turned onto
  # UCO3D's axes on read (housecorr3d/omni6dpose_uco3d.py, from od3d), as od3d's
  # Omni6DPose evaluation has it (use_map_obj_orient_uco3d: True). Not baked
  # into the shards.
  map_obj_orient_to_uco3d: true
