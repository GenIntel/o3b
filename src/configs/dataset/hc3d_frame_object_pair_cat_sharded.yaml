# Sharded variant of hc3d_frame_object.
#
# On first use the items are materialised once into
#   <path_preprocess>/sharded/<sharded_name>
# and loaded from there on subsequent runs (HuggingFace save_to_disk / load_from_disk).
# Set sharded_override: true to rebuild the shards even if they already exist.
## o3b dataset init -d hc3d_frame_object_pair_cat_sharded --remote -p slurm_lmbl40

# o3b dataset viz -d hc3d_frame_object_pair_cat_sharded

defaults:
  - hc3d_frame_object_pair
  - _self_


category: "hair_dryer"

categories:
  - ${category}


# viewpoints (frames) sampled per object instance when forming cross-instance
# pairs (1 = a single representative frame per instance, -1 = all available frames)
frame_pair_views_per_instance: 50 # per instance pair, 20 pairs * 5 = 100

# how the two instances' viewpoints combine:
#   aligned → view i of A with view i of B   (~n_views pairs per instance pair)
#   cross   → every view of A with every view of B  (~n_views^2)
frame_pair_view_mode: aligned
img_size: 512

sharded_name: hc3d_frame_object_pair_${img_size}_${category}
sharded_override: false
sharded_shard_size: 5  # items per Arrow shard; lower = less peak memory during build



#sharded_name: hc3d_frame_object_pair_${category}
#sharded_override: true #  true
# overrides the (already-lowered) default from hc3d_frame_object_pair.yaml;
# kept explicit here since this is the config that actually triggers the build


sharded_shard_size: 100 # cache batch size and final shard size
# note that especially cache batch size heavily affects /dev/shm when using shared memory
# worker processes for the one-off shard build (items are loaded + serialised to
# bytes in the workers, so /dev/shm tensor transport is not involved); 0 = sequential

# actually it seems like /dev/shm is currently not affected probably only when 
#   torch.multiprocessing.set_sharing_strategy("file_system") instead of 
#   torch.multiprocessing.set_sharing_strategy("file_descriptor")  (DEFAULT)

sharded_num_workers: 4
# perhaps this should be ram_in_gb / sharded_worker_gb = 20 / 5 = 4
# sharded_worker_gb: see that each worker usually creates their own dataset copy

