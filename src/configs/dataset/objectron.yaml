# Objectron — frame-object items from the od3d-preprocessed tree.
#
#   o3b dataset fetch -d objectron -p slurm_lmbl40 --remote
#   o3b dataset index -d objectron -p slurm_lmbl40 --remote
#
# 2,250 items: 9 categories x 50 sequences x 5 frames, evenly spaced through each
# video. That sampling is recorded in the preprocessed tree's own filenames
# (mask/sam_bbox/test/<cat>/<seq>/<frame>.png), so the walk reads it rather than
# re-deriving which sequences and frames od3d drew.
#
# No protobuf decoding: od3d already resolved video.MOV + annotation.pbdata into
# meta/frames/**.yaml and extracted the rgb into <path_raw>/frames/.
#
# fetch() is a copy, not a download — Objectron's GCS bucket stopped serving
# anonymous callers (od3d's own downloader needs `gcloud auth login`).

class_name: Objectron

path_datasets_raw: /data/lmbraid19/sommerl/datasets
path_datasets_preprocess: /data/lmbraid19/sommerl/datasets

# Where fetch() looks for an existing tree when path_raw is missing or partial.
# Separate from path_datasets_raw because a platform overrides *that* to its own
# dataset root: the fallback has to keep naming a different machine's copy, or a
# fetch on the cluster would "fall back" to the very tree it just found empty.
# Override it (here or with -p) to point somewhere else.
path_datasets_fallback: /data/lmbraid19/sommerl/datasets

path_raw:        ${path_datasets_raw}/Objectron
path_preprocess: ${path_datasets_preprocess}/Objectron_Preprocess

item_type: frame_object
split: test

cam_tform4x4_cam_raw:
  - [ 1.00000,  0.00000,  0.00000,  0.00000]
  - [ 0.00000, -1.00000,  0.00000,  0.00000]
  - [ 0.00000,  0.00000, -1.00000,  0.00000]
  - [ 0.00000,  0.00000,  0.00000,  1.00000]

modalities:
  - rgb
  - depth                  # depth_anything_v3 — a MONOCULAR ESTIMATE, not sensed
  - depth_mask
  - fo_mask
  - fo_mask_amodal         # the mesh rasterised under the GT pose — overlay it
                           # on the rgb to see whether pose and object frame
                           # actually agree with the image
  - cam_intr4x4
  - cam_tform4x4_obj
  - cam_tform4x4_obj_ncds
  - cam_bbox2d
  - cam_bbox3d             # (8,3) box corners in CAMERA space — what
                           #   FrameObject.viz draws its 3-D box from
  - obj_bbox3d             # (8,3) the same corners in OBJECT space
  - obj_syms
  - category
  - mesh                   # cuboid500 — the annotated 3-D box, not a scan

# 256, matching the resolution od3d sharded these at (maskzoom256) — the
# resolution the published numbers were measured at. hc3d notes 256->512 was
# worth ~1% on tooth_brush, so raising it is an improvement to make as a
# deliberate ablation once the reproduction lines up, not a silent difference.
img_size: 256

transform:
  class_name: CropCamBBox2D
  H: ${img_size}
  W: ${img_size}
  # od3d's maskzoom is the same operation as this: both centre on the mask's
  # bbox, square it on the longer side, and resize. Its scale_with_mask: 0.75
  # is commented "1. / 1.3 = 0.75" — i.e. it meant this 1.3 (= 1 + 2*0.15) and
  # rounded. Keeping 0.15, so the crop is what od3d intended; the 2.6% zoom
  # difference against what it literally wrote is well inside run-to-run noise.
  bbox_overlap: 0.15
  crop_type: "crop_large_side"

categories:            # null = all 9
filter_count_max:

extra:
  depth_type: depth_anything_v3
  mask_type: sam_bbox
  mesh_type: cuboid500
  map_to_uco3d: true
  fetch_copy_from: ${path_datasets_fallback}/Objectron
  fetch_copy_from_preprocess: ${path_datasets_fallback}/Objectron_Preprocess
