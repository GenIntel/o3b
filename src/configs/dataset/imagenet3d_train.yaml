# imagenet3d_train — the train split of imagenet3d.
#
#   o3b dataset index -d imagenet3d_train -p slurm_lmbl40
#   o3b dataset viz   -d imagenet3d_train -p slurm_lmbl40 --remote -c chair
#
# Everything else — paths, modalities, transform, the UCO3D alignment — is
# inherited from imagenet3d.yaml; this file only pins the split.

defaults:
  - imagenet3d
  - _self_

split: train
