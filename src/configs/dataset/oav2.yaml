# oav2 — Orient Anything V2's training renders (Viglong/OriAnyV2_Train_Render),
# read from od3d's preprocessed tree. ~1.2M renders of 3,720 categories, train
# split only. See o3b/dataset/oav2/dataset.py for what is (and is not) labelled.
#
#   o3b dataset index -d oav2 -p slurm_lmbl40 --remote
#   o3b dataset viz   -d oav2 -p slurm_lmbl40 --remote -c aardvark

class_name: OrientAnythingV2

path_datasets_raw: /data/lmbraid19/sommerl/datasets
path_datasets_preprocess: /data/lmbraid19/sommerl/datasets

path_raw:        ${path_datasets_raw}/OrientAnythingV2
path_preprocess: ${path_datasets_preprocess}/OrientAnythingV2_Preprocess

item_type: frame_object
split: train

# od3d writes cam<-obj in an OpenCV-style frame; o3b is OpenGL.
cam_tform4x4_cam_raw:
  - [ 1.00000,  0.00000,  0.00000,  0.00000]
  - [ 0.00000, -1.00000,  0.00000,  0.00000]
  - [ 0.00000,  0.00000, -1.00000,  0.00000]
  - [ 0.00000,  0.00000,  0.00000,  1.00000]

# od3d's spherical object frame (x = left, y = back, z = top) is UCO3D's raw
# labelling, so the SAME matrix uco3d.yaml applies takes it to o3b's
# right / top / back = X / Y / Z. Applied on read (extra.map_to_uco3d), never
# baked into the shards; no per-category re-orientation exists for this set.
obj_gl_tform4x4_obj_raw:
  - [-1.00000,  0.00000,  0.00000,  0.00000]
  - [ 0.00000,  0.00000,  1.00000,  0.00000]
  - [ 0.00000,  1.00000,  0.00000,  0.00000]
  - [ 0.00000,  0.00000,  0.00000,  1.00000]

modalities:
  - rgb
  - depth
  - depth_mask
  - fo_mask
  - cam_intr4x4
  - cam_tform4x4_obj
  - cam_tform4x4_obj_ncds
  - cam_bbox2d
  - cam_bbox3d
  - obj_bbox3d
  - obj_syms
  - obj_size3d
  - category

# 256, as od3d sharded it (maskzoom256) and as every other Trinity training set
img_size: 256

transform:
  class_name: CropCamBBox2D
  H: ${img_size}
  W: ${img_size}
  bbox_overlap: 0.15
  crop_type: "crop_large_side"

categories:            # null = all 3,720
filter_count_max:

extra:
  # od3d's depth preprocess for this set (its OrientAnythingV2.depth_type)
  depth_type: depth_anything_v3
  # applies obj_gl_tform4x4_obj_raw on read; the loader maps no category onto
  # UCO3D, so no UCO3D symmetry is attached
  map_to_uco3d: true
