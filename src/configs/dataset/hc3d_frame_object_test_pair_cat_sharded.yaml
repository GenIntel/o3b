# Sharded variant of hc3d_frame_object_test_pair.
#
# On first use the items are materialised once into
#   <path_preprocess>/sharded/<sharded_name>
# and loaded from there on subsequent runs (HuggingFace save_to_disk / load_from_disk).
# Set sharded_override: true to rebuild the shards even if they already exist.


# 1) index frame object
# o3b dataset index -d hc3d_frame_object_test --remote -p slurm_lmbl40
# 1 b) preprocess frame object? to see if it is availabl

# 2) preprocess for obj_kpts3d_mask ? or obj mesh ?
# o3b dataset preprocess -d hc3d_frame_object_test --remote -p slurm_lmbl40

# 2) index frame object pair ? 
# o3b dataset index -d hc3d_frame_object_test_pair --remote -p slurm_lmbl40

# 3) shard dataset
# o3b dataset init -d hc3d_frame_object_test_pair_cat_sharded --remote -p slurm_lmbl40 --override
# o3b dataset init -d hc3d_frame_object_test_pair_cat_sharded --override -p slurm_lmbl40 --remote -a "-c backpack,-c book,-c bottle,-c box,-c bread,-c coconut,-c conch,-c corn,-c dinosaur,-c dish,-c doll,-c egg,-c eraser,-c facial_cream,-c flower_pot,-c glasses_case,-c hair_dryer,-c hamburger,-c handbag,-c hand_cream,-c knife,-c lemon,-c light,-c lotus_root,-c mango,-c mangosteen,-c medicine_bottle,-c mouse,-c mug,-c orange,-c pillow,-c pomegranate,-c power_strip,-c remote_control,-c sausage,-c shampoo,-c shoe,-c shrimp,-c teapot,-c tooth_brush,-c tooth_paste,-c toy_animals,-c toy_boat,-c toy_bus,-c toy_car,-c toy_motorcycle,-c toy_plane,-c toy_train,-c toy_truck,-c wallet"

# 4) viz
# o3b dataset viz -d hc3d_frame_object_test_pair_cat_sharded -p slurm_lmbl40 --remote

# 4b) upload the built shards to the HuggingFace Hub — one repo per category,
#     ${huggingface_name}; --override replaces an already-uploaded cache
# o3b dataset hf-upload -d hc3d_frame_object_test_pair_cat_sharded --override -p slurm_lmbl40 --remote -a "-c backpack"
#     …and, on the consuming machine, set use_huggingface: true to pull them
#     into <path_preprocess>/sharded/ instead of building them from raw data

# 5) copy the built shards to another platform (runs on this machine, which is the
#    only host that can reach both clusters; -c '*' takes every category at once,
#    -n previews). Re-runs resume; an existing identical target is skipped.
# o3b dataset sync-shard -d hc3d_frame_object_test_pair_cat_sharded -s slurm -t slurm_jupiter -c '*'


defaults:
  - hc3d_frame_object_test_pair
  - _self_


category: "hair_dryer"

mesh_type: "mc16"

categories:
  - ${category}


# viewpoints (frames) sampled per object instance when forming cross-instance
# pairs (1 = a single representative frame per instance, -1 = all available frames)
frame_pair_views_per_instance: 50 # per instance pair, 20 pairs * 5 = 100
filter_count_max: 1000 

# how the two instances' viewpoints combine:
#   aligned → view i of A with view i of B   (~n_views pairs per instance pair)
#   cross   → every view of A with every view of B  (~n_views^2)
frame_pair_view_mode: cross # aligned
img_size: 512
sharded_shard_size: 100  # items per Arrow shard; lower = less peak memory during build


sharded_name: hc3d_frame_object_test_n${filter_count_max}_b${sharded_shard_size}_r${img_size}_m${mesh_type}_c${category}

#sharded_name: hc3d_frame_object_pair_${filter_count_max}_b${sharded_shard_size}_r${img_size}_c${category}
sharded_override: false


# HuggingFace Hub repo holding this category's sharded cache — one repo per
# category (see hf-upload above), with the cache in a folder named after
# ${sharded_name}, so caches that differ only in shard parameters (n / b / r /
# mesh_type) live side by side in it.
# use_huggingface: true downloads that folder into
# <path_preprocess>/sharded/<sharded_name> instead of building it from the raw
# data, so no index / ROPE / SOPE files are needed on that machine.
huggingface_name: GenIntel/hc3d_frame_object_test_pair_cat_sharded_c${category}
use_huggingface: false


sharded_num_workers: 4
# perhaps this should be ram_in_gb / sharded_worker_gb = 20 / 5 = 4
# sharded_worker_gb: see that each worker usually creates their own dataset copy







