# housecat6d_test_sharded — every HouseCat6D test frame-object (5 scenes, all frames), 256-px crops.
#
#   o3b dataset init -d housecat6d_test_sharded -p slurm_lmbl40 --remote

defaults:
  - housecat6d
  - _self_

sharded_shard_size: 500
sharded_num_workers: 8
sharded_transform:
  class_name: CropCamBBox2D
  H: ${img_size}
  W: ${img_size}
  bbox_overlap: 0.15
  crop_type: "crop_large_side"
transform:
sharded_name: housecat6d_test_r${img_size}_all
sharded_override: false
