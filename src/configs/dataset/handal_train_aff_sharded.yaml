# handal_train_aff_sharded — HANDAL train crops with the handle (H12).
#
#   o3b dataset init -d handal_train_aff_sharded -p slurm_lmbl40 --remote
#
# handal_train_sharded plus two modalities:
#   fo_mask_aff        mask_parts/<frame>_<obj>_handle.png, cropped with the rest;
#                      a frame without one is dropped (the protocol scores only those)
#   mesh_vert_labels   per-vertex handle labels on the mc16 mesh, from
#                      models_parts/obj_N_{handle,not}.ply (None for an object whose
#                      part meshes do not lie on its model)
# and 32 instead of 16 frames per sequence: the handle masks are the training
# signal here, and HANDAL's sequences are long.

defaults:
  - handal_train
  - _self_

categories:            # null = every category

modalities:
  - rgb
  - depth
  - depth_mask
  - fo_mask
  - fo_mask_aff
  - cam_intr4x4
  - cam_tform4x4_obj
  - cam_tform4x4_obj_ncds
  - cam_bbox2d
  - cam_bbox3d
  - obj_bbox3d
  - obj_syms
  - obj_size3d
  - category
  - mesh
  - mesh_vert_labels

extra:
  frames_count_max_per_sequence: 32

filter_count_max:      # null = no cap

sharded_shard_size: 500
sharded_num_workers: 8

sharded_transform:
  class_name: CropCamBBox2D
  H: ${img_size}
  W: ${img_size}
  bbox_overlap: 0.15
  crop_type: "crop_large_side"

transform:

sharded_name: handal_train_aff_r${img_size}_f32_all
sharded_override: false
