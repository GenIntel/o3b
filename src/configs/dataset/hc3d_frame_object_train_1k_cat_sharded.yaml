# Sharded hc3d_frame_object filtered to a single category (toy_boat).
#
# Items are materialised once into
#   <path_preprocess>/sharded/<sharded_name>
# and loaded from there on subsequent runs. The category name is part of the
# sharded_name so per-category shards live side by side.
#
# o3b dataset fetch -d hc3d_frame_object_train_cat_sharded
# o3b dataset index -d hc3d_frame_object_train_cat_sharded
# o3b dataset viz -d hc3d_frame_object_train_cat_sharded

# 
# o3b dataset index -d hc3d_frame_object_train_1k_cat_sharded -p slurm_lmbl40 --remote
# o3b dataset init -d hc3d_frame_object_train_1k_cat_sharded -p slurm_lmbl40 --remote
# o3b dataset viz -d hc3d_frame_object_train_1k_cat_sharded -p slurm_lmbl40 --remote

# sharding problems: 
#   a) only 900 instead of 1000?
#   b) an error occured 22/900, less workers? or freeing ram? 

# sharding i
# o3b dataset viz -d hc3d_frame_object_train_cat_sharded

defaults:
  - hc3d_frame_object_train
  - _self_

# Single category to filter for; referenced below via ${category} so the
# category name is also reflected in the sharded dataset directory.
category: hair_dryer

categories:
  - ${category}


# Full list — a list in this file replaces the parent's rather than extending it.
# Same modalities as hc3d_frame_object_train plus fo_mask_dt, the normalised
# distance transform of fo_mask.  The distance transforms (and fo_mask_amodal,
# which needs a rasterised GT mesh) are computed once per item while the shards
# are built — after sharded_transform's crop, so they match the cropped 512²
# image — and the DTs are stored as uint16, so training reads them instead of
# paying a distance transform (or a mesh render) per batch, see
# CamGeo2D3D._get_mask_dt.  Adding a modality here needs a shard rebuild.
modalities:
  - rgb                    # GenPose2 input
  - depth                  # GenPose2 input
  - depth_mask             # GenPose2 input
  - fo_mask                # GenPose2 input (object instance mask)
  - fo_mask_dt             # normalised DT of fo_mask, baked in at shard-build time
  - fo_mask_amodal         # GT mesh rendered under the GT pose (occluders filled in)
  - fo_mask_amodal_dt      # normalised DT of fo_mask_amodal, baked in at shard-build time
  - cam_intr4x4            # crop transform + GenPose2
  - cam_tform4x4_obj       # GT pose
  - cam_tform4x4_obj_ncds  # task: maps obj_kpts3d (NCDS) → camera space
  - cam_bbox2d             # required by the CropCamBBox2D transform
  - cam_bbox3d             # obj-space 3D box side lengths (drawn in qualit)
  - obj_syms               # per-axis symmetry code (see CamCrsp3DNNTask keypoint symmetry eval)
  - category
  - mesh                   # GT object mesh (deduplicated into the shards' mesh sidecar)


img_size: 512
sharded_shard_size: 100 # cache batch size and final shard size
# note that especially cache batch size heavily affects /dev/shm when using shared memory
# worker processes for the one-off shard build (items are loaded + serialised to
# bytes in the workers, so /dev/shm tensor transport is not involved); 0 = sequential

# actually it seems like /dev/shm is currently not affected probably only when 
#   torch.multiprocessing.set_sharing_strategy("file_system") instead of 
#   torch.multiprocessing.set_sharing_strategy("file_descriptor")  (DEFAULT)

sharded_num_workers: 4
# perhaps this should be ram_in_gb / sharded_worker_gb = 20 / 5 = 4
# sharded_worker_gb: see that each worker usually creates their own dataset copy

filter_count_max: 1000 # 50000 # per category if categories is applied

sharded_transform:
  class_name: CropCamBBox2D
  H: ${img_size}  # 512 # 256->512 1% improvement for tooth brush
  W: ${img_size}
  # per-side crop margin as a fraction of bbox size (crop spans 1 + 2*bbox_overlap)
  bbox_overlap: 0.15
  crop_type: "crop_large_side" # "crop_large_side" | "crop_small_side" | "crop_resize_ratio"

transform:

sharded_name: hc3d_frame_object_train_${filter_count_max}_b${sharded_shard_size}_r${img_size}_c${category}
sharded_override: false

# overrides the (already-lowered) default from hc3d_frame_object_pair.yaml;
# kept explicit here since this is the config that actually triggers the build
#
 

# sharded_transform is baked into the shards at build time (applied once per
# item in the shard-build workers), so reads from the cache pay no crop cost.
# transform (empty here) would additionally run in __getitem__ on every access.
# NOTE: changing sharded_transform requires a rebuild (sharded_override: true
# or bump sharded_name) — an existing cache dir is loaded as-is.
