[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "o3b"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "gdown",
    "hydra-core",
    "omegaconf",
    "opencv-python<5",  # opencv 5.0 wheels dropped OpenEXR support (depth/mask .exr loading)
    "torchvision",
    "potpourri3d", # fmap
    "robust-laplacian", # fmap
    "xatlas",
    "scipy",
    "timm",
    "PyYAML>=6.0",
    "viser>=0.2",
    "trimesh>=4.0",
    "rtree",  # trimesh.nearest.on_surface (mesh-barycentric correspondence) needs it

    "wandb",
    "torch_geometric",
    "gdist",
    "qwen-vl-utils",
    "datasets",
]

[project.scripts]
o3b          = "o3b.cli:main"
od3d_dataset = "o3b.dataset.cli:main"

[project.optional-dependencies]
pyrender = ["pyrender2"]
nvdiffrast = ["nvdiffrast @ git+https://github.com/NVlabs/nvdiffrast.git"]
# Optional because neither installs on linux-aarch64 (JUPITER's Grace nodes):
#  * open3d ships aarch64 wheels only up to 0.18.0/cp311, and JSC offers python
#    3.12+ only, so no wheel can ever match.
#  * libigl has no aarch64 wheel and its sdist compiles but then dies in
#    nanobind stub generation with "ImportError: std::bad_cast".
# Neither is on the core import path -- o3b, o3b.cli, the dataset loaders,
# datatypes and viz all import cleanly without them -- so they are hard
# requirements nowhere and setup_slurm.sh installs them best-effort, which keeps
# every x86_64 platform exactly as before.
open3d = ["open3d"]
libigl = ["libigl"]

[tool.setuptools.packages.find]
where = ["src"]
